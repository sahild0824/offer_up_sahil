<title>Fourth Pick War Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #f3f4f0;
    --surface: #fcfcfb;
    --surface-2: #ebeee7;
    --ink: #14181a;
    --ink-2: #565c58;
    --muted: #7f857f;
    --hair: #dfe2dc;
    --accent: #a4771a;
    --accent-ink: #6f4f0a;
    --accent-soft: #f7ecd1;
    --wr: #2a78d6;
    --rb: #1baf7a;
    --te: #eb6834;
    --qb: #565c58;
    --good: #0ca30c;
    --bad: #d03b3b;
    --warn: #ec835a;
    --track-good: #d9efd7;
    --track-bad: #f6d9d9;
    --track-warn: #fbe3d9;
    --shadow: 0 -6px 24px rgba(20, 24, 26, 0.16);
    --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121513;
      --surface: #1b1f1c;
      --surface-2: #252a26;
      --ink: #f1f3ee;
      --ink-2: #b7bdb6;
      --muted: #8a908a;
      --hair: #2d332f;
      --accent: #e0b14a;
      --accent-ink: #f0cd7a;
      --accent-soft: #3a3120;
      --wr: #3987e5;
      --rb: #199e70;
      --te: #d95926;
      --qb: #b7bdb6;
      --good: #2eb82e;
      --bad: #e05252;
      --warn: #ec835a;
      --track-good: #203622;
      --track-bad: #3c2424;
      --track-warn: #3b2b22;
      --shadow: 0 -6px 24px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121513;
    --surface: #1b1f1c;
    --surface-2: #252a26;
    --ink: #f1f3ee;
    --ink-2: #b7bdb6;
    --muted: #8a908a;
    --hair: #2d332f;
    --accent: #e0b14a;
    --accent-ink: #f0cd7a;
    --accent-soft: #3a3120;
    --wr: #3987e5;
    --rb: #199e70;
    --te: #d95926;
    --qb: #b7bdb6;
    --good: #2eb82e;
    --bad: #e05252;
    --warn: #ec835a;
    --track-good: #203622;
    --track-bad: #3c2424;
    --track-warn: #3b2b22;
    --shadow: 0 -6px 24px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.4;
    padding-bottom: calc(64px + env(safe-area-inset-bottom));
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.05; }
  h2 { font-size: 24px; font-weight: 700; letter-spacing: 0.01em; text-transform: uppercase; }
  h3 { font-size: 19px; font-weight: 600; }
  p { margin: 0; }
  .num { font-variant-numeric: tabular-nums; }
  .eyebrow {
    font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
  }

  /* Top bar */
  .top {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top));
    background: var(--surface); border-bottom: 1px solid var(--hair);
  }
  .brand { font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1; }
  .brand small { display: block; font-family: var(--body); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--muted); margin-top: 3px; text-transform: uppercase; }
  .clock {
    font-family: var(--display); font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 6px 10px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-ink); white-space: nowrap;
  }

  main { max-width: 640px; margin: 0 auto; padding: 12px 12px 24px; }
  .tab[hidden] { display: none; }
  .stack { display: grid; gap: 14px; }

  /* Bottom tabs */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--surface); border-top: 1px solid var(--hair);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabs button {
    background: none; border: 0; padding: 10px 4px 8px;
    font-family: var(--display); font-size: 15px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); border-top: 3px solid transparent; margin-top: -1px;
  }
  .tabs button[aria-selected="true"] { color: var(--ink); border-top-color: var(--accent); }

  /* Cards & lists */
  .card { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 14px; }
  .card h2 { margin-bottom: 8px; }
  .card p + p { margin-top: 8px; }
  .lede { font-size: 16px; color: var(--ink); }
  .note { color: var(--ink-2); font-size: 14px; }
  .list { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .list li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: baseline; }
  .list li .n { font-family: var(--display); font-weight: 700; color: var(--accent-ink); font-size: 18px; text-align: right; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  .divider { border: 0; border-top: 1px solid var(--hair); margin: 12px 0; }

  /* Round plan */
  .round { display: grid; grid-template-columns: 56px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--hair); }
  .round:first-of-type { border-top: 0; padding-top: 4px; }
  .round .pick { font-family: var(--display); line-height: 1; }
  .round .pick b { display: block; font-size: 30px; font-weight: 700; }
  .round .pick span { display: block; font-size: 12px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 2px; font-family: var(--body); }
  .round .pri { font-weight: 600; margin-bottom: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--hair); background: var(--surface-2); border-radius: 999px;
    padding: 4px 10px; font-size: 13px; font-weight: 500; line-height: 1.2;
  }
  button.chip { color: var(--ink); }
  button.chip.taken { text-decoration: line-through; color: var(--muted); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  /* Position chips */
  .pos {
    font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 0.06em;
    color: #fff; border-radius: 4px; padding: 2px 6px; line-height: 1.2; flex: none;
  }
  .pos.WR { background: var(--wr); }
  .pos.RB { background: var(--rb); }
  .pos.TE { background: var(--te); }
  .pos.QB { background: var(--qb); color: var(--bg); }
  .dot.WR { background: var(--wr); } .dot.RB { background: var(--rb); } .dot.TE { background: var(--te); } .dot.QB { background: var(--qb); }

  /* Filter row */
  .filters { display: grid; gap: 8px; position: sticky; top: 58px; z-index: 10; background: var(--bg); padding: 4px 0 8px; }
  .seg { display: flex; gap: 4px; background: var(--surface-2); border-radius: 8px; padding: 3px; }
  .seg button {
    flex: 1; border: 0; background: none; border-radius: 6px; padding: 6px 0;
    font-family: var(--display); font-size: 15px; font-weight: 600; letter-spacing: 0.05em; color: var(--muted);
  }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
  .row2 { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .row2 input, .row2 select {
    width: 100%; border: 1px solid var(--hair); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: 15px;
  }
  .row2 select { min-width: 132px; }

  /* Player rows */
  .players { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .prow {
    width: 100%; text-align: left; border: 1px solid var(--hair); background: var(--surface); border-radius: 10px;
    padding: 10px 12px; display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 10px; align-items: center;
  }
  .prow.taken { opacity: 0.45; }
  .prow.taken .name { text-decoration: line-through; }
  .prow.mine { border-color: var(--accent); background: var(--accent-soft); }
  .prow .rank { font-family: var(--display); font-size: 24px; font-weight: 700; line-height: 1; color: var(--ink-2); text-align: right; grid-row: span 2; }
  .prow .name { font-family: var(--display); font-size: 19px; font-weight: 600; line-height: 1.1; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .prow .name span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow .comp { font-family: var(--display); font-size: 20px; font-weight: 700; text-align: right; line-height: 1; }
  .prow .comp small { display: block; font-family: var(--body); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
  .prow .meta { grid-column: 2 / 4; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .prow .meta b { color: var(--ink-2); font-weight: 600; }
  .prow .meters { grid-column: 2 / 4; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
  .prow .flag { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-ink); }

  /* Meters */
  .meter { display: grid; gap: 3px; }
  .meter .lab { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .meter .lab b { color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }
  .meter .track { height: 6px; border-radius: 3px; overflow: hidden; }
  .meter .fill { height: 100%; border-radius: 0 3px 3px 0; }
  .meter.boom .track { background: var(--track-good); } .meter.boom .fill { background: var(--good); }
  .meter.bust .track { background: var(--track-bad); } .meter.bust .fill { background: var(--bad); }
  .meter.risk .track { background: var(--track-warn); } .meter.risk .fill { background: var(--warn); }
  .meter.big .track { height: 10px; border-radius: 5px; }
  .meter.big .lab { font-size: 12px; } .meter.big .lab b { font-size: 16px; font-family: var(--display); }

  /* Sheet */
  .sheet {
    position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; justify-content: flex-end;
    background: rgba(10, 12, 11, 0.45);
  }
  .sheet .panel {
    background: var(--surface); border-radius: 16px 16px 0 0; box-shadow: var(--shadow);
    max-height: 92vh; overflow-y: auto; padding: 8px 16px calc(24px + env(safe-area-inset-bottom));
    max-width: 640px; width: 100%; margin: 0 auto;
  }
  .sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--hair); margin: 4px auto 12px; }
  .sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .sheet-head h2 { font-size: 30px; text-transform: none; letter-spacing: 0; }
  .sheet-head .sub { color: var(--ink-2); font-size: 14px; margin-top: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .close { border: 0; background: var(--surface-2); border-radius: 50%; width: 36px; height: 36px; font-size: 18px; line-height: 1; flex: none; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
  .tile { background: var(--surface-2); border-radius: 8px; padding: 10px; }
  .tile .lab { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .tile .val { font-family: var(--display); font-size: 28px; font-weight: 700; line-height: 1.1; margin-top: 2px; }
  .tile .val small { font-size: 14px; font-weight: 600; color: var(--ink-2); margin-left: 2px; }
  .tile .val.up { color: var(--good); } .tile .val.down { color: var(--bad); }
  .sec { margin-top: 18px; }
  .sec h3 { margin-bottom: 8px; }
  .why { margin: 0; padding: 0 0 0 18px; color: var(--ink-2); font-size: 14px; display: grid; gap: 3px; }
  .why.empty { list-style: none; padding: 0; }
  .srcs { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; margin-top: 8px; }
  .srcs .k { color: var(--ink-2); }
  .srcs .v { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  .strip { width: 100%; height: auto; display: block; margin-top: 6px; }
  .avail { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .avail .a { border-radius: 6px; padding: 5px 8px; font-size: 13px; background: var(--surface-2); display: grid; line-height: 1.15; min-width: 64px; }
  .avail .a small { color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
  .avail .a b { font-family: var(--display); font-size: 17px; }
  .avail .a.hi b { color: var(--good); } .avail .a.lo b { color: var(--muted); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .btn {
    border: 1px solid var(--hair); background: var(--surface-2); border-radius: 8px; padding: 10px;
    font-family: var(--display); font-size: 16px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
  }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.on { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }
  .btn.small { padding: 6px 10px; font-size: 14px; }

  /* Draft tab */
  .settings { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
  .settings label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .settings input { border: 1px solid var(--hair); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: 16px; width: 100%; }
  .pickline { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pickline span { font-family: var(--display); font-weight: 600; font-size: 15px; padding: 3px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); }
  .pickline span.done { text-decoration: line-through; color: var(--muted); }
  .pickline span.next { background: var(--accent-soft); color: var(--accent-ink); }
  .onclock { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .onclock .tile .val { font-size: 32px; }
  .roster { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .best h3 { display: flex; justify-content: space-between; align-items: baseline; }
  .best h3 small { font-family: var(--body); font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
  .mini { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; }
  .mini button {
    width: 100%; text-align: left; border: 0; background: var(--surface-2); border-radius: 8px; padding: 8px 10px;
    display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center;
  }
  .mini .nm { font-family: var(--display); font-size: 17px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .mini .cm { font-family: var(--display); font-size: 17px; font-weight: 700; }
  .mini .sub { grid-column: 1 / 3; font-size: 12px; color: var(--muted); }
  .mini .sub b { color: var(--accent-ink); font-weight: 600; }
  .empty { color: var(--muted); font-size: 14px; padding: 12px 0; text-align: center; }

  /* Model tab */
  .formula { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: pre; color: var(--ink-2); margin-top: 8px; }
  .srclist { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; }
  .srclist li { display: grid; grid-template-columns: 1fr auto; gap: 8px; border-top: 1px solid var(--hair); padding-top: 6px; }
  .srclist li:first-child { border-top: 0; padding-top: 0; }
  .srclist small { color: var(--muted); display: block; }
  a { color: var(--accent-ink); }

  @media (prefers-reduced-motion: no-preference) {
    .sheet .panel { animation: up 180ms ease-out; }
    @keyframes up { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
  }
</style>

<header class="top">
  <div class="brand">Fourth Pick<small>10-team · full PPR · snake</small></div>
  <div class="clock" id="clock">Pick 4</div>
</header>

<main>
  <section class="tab stack" id="tab-plan"></section>
  <section class="tab stack" id="tab-board" hidden>
    <div class="filters">
      <div class="seg" id="posSeg" role="group" aria-label="Position filter"></div>
      <div class="row2">
        <input type="search" id="q" placeholder="Search player or team" autocomplete="off" aria-label="Search players">
        <select id="sort" aria-label="Sort by">
          <option value="comp">Composite</option>
          <option value="boom">Boom ↓</option>
          <option value="bust">Bust ↓</option>
          <option value="risk">Risk ↓</option>
          <option value="value">Value vs ADP</option>
          <option value="adp">ADP</option>
        </select>
      </div>
    </div>
    <ul class="players" id="board"></ul>
  </section>
  <section class="tab stack" id="tab-draft" hidden></section>
  <section class="tab stack" id="tab-model" hidden></section>
</main>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="plan" aria-selected="true">Plan</button>
  <button role="tab" data-tab="board" aria-selected="false">Board</button>
  <button role="tab" data-tab="draft" aria-selected="false">Draft</button>
  <button role="tab" data-tab="model" aria-selected="false">Model</button>
</nav>

<div class="sheet" id="sheet" hidden></div>

<script id="data" type="application/json">
/*__DATA__*/
</script>
<script>
(function () {
  'use strict';
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const PLAYERS = DATA.players;
  const STRATEGY = DATA.strategy;
  const META = DATA.meta;
  const byId = new Map(PLAYERS.map(p => [p.id, p]));
  const normName = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/['.]/g, '').replace(/-/g, ' ').replace(/\b(jr|sr|ii|iii|iv)\b/g, '').replace(/\s+/g, ' ').trim();
  const byName = new Map(PLAYERS.map(p => [normName(p.name), p]));
  const findPlayer = name => byName.get(normName(name));
  const POS = ['ALL', 'QB', 'RB', 'WR', 'TE'];

  // ---------- state ----------
  const state = { tab: 'plan', pos: 'ALL', sort: 'comp', q: '', taken: new Set(), mine: [], teams: 10, slot: 4 };
  const KEY = 'fourth-pick-war-room';
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (s) {
        state.taken = new Set(s.taken || []);
        state.mine = s.mine || [];
        state.teams = s.teams || 10;
        state.slot = s.slot || 4;
        state.tab = s.tab || 'plan';
      }
    } catch (e) { /* storage unavailable: run in memory */ }
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ taken: [...state.taken], mine: state.mine, teams: state.teams, slot: state.slot, tab: state.tab }));
    } catch (e) { /* ignore */ }
  }

  // ---------- helpers ----------
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const fmt1 = v => (v == null ? '–' : (Math.round(v * 10) / 10).toFixed(1));
  const fmt0 = v => (v == null ? '–' : String(Math.round(v)));
  const signed = v => (v == null ? '–' : (v > 0 ? '+' : '') + fmt1(v));
  function myPicks(teams, slot, rounds) {
    const out = [];
    for (let r = 1; r <= rounds; r++) out.push(r % 2 ? (r - 1) * teams + slot : r * teams - slot + 1);
    return out;
  }
  // Probability a player is still on the board at overall pick p, from ADP.
  // Logistic around ADP; the spread widens as ADP grows (later picks are noisier).
  function pAvail(adp, p) {
    if (adp == null) return null;
    const s = Math.max(1.6, 0.16 * adp);
    return 1 / (1 + Math.exp((p - adp) / s));
  }
  function nextPickInfo() {
    const picks = myPicks(state.teams, state.slot, 16);
    const made = state.mine.length;
    const cur = state.taken.size + 1;
    const next = picks[made] != null ? picks[made] : null;
    return { picks, made, cur, next, until: next != null ? next - cur : null };
  }

  // ---------- meters ----------
  function meter(kind, label, val, big) {
    const m = el('div', 'meter ' + kind + (big ? ' big' : ''));

  // Rank strip: one horizontal scale from 1 to the max rank in view; a dot per source, a bar for the composite, a hollow marker for ADP.
  function rankStrip(p) {
    const ranks = Object.values(p.sources);
    const all = ranks.concat([p.comp]).concat(p.adp != null ? [p.adp] : []);
    const lo = Math.max(1, Math.floor(Math.min.apply(null, all)) - 2), hi = Math.ceil(Math.max.apply(null, all)) + 2;
    const W = 320, H = 46, padL = 10, padR = 10, y = 22;
    const x = v => padL + (W - padL - padR) * (v - lo) / Math.max(1, hi - lo);
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg'); svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('class', 'strip'); svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'Source ranks from ' + fmt0(p.best) + ' to ' + fmt0(p.worst) + ', composite ' + fmt1(p.comp));
    const line = document.createElementNS(svgNS, 'line'); line.setAttribute('x1', padL); line.setAttribute('x2', W - padR); line.setAttribute('y1', y); line.setAttribute('y2', y); line.setAttribute('stroke', 'var(--hair)'); line.setAttribute('stroke-width', '1'); svg.append(line);
    const cs = getComputedStyle(document.documentElement);
    const posColor = cs.getPropertyValue('--' + p.pos.toLowerCase()).trim() || '#888';
    ranks.forEach(r => { const c = document.createElementNS(svgNS, 'circle'); c.setAttribute('cx', x(r)); c.setAttribute('cy', y); c.setAttribute('r', 5); c.setAttribute('fill', posColor); c.setAttribute('stroke', 'var(--surface)'); c.setAttribute('stroke-width', '2'); svg.append(c); });
    const cm = document.createElementNS(svgNS, 'rect'); cm.setAttribute('x', x(p.comp) - 2); cm.setAttribute('y', y - 12); cm.setAttribute('width', 4); cm.setAttribute('height', 24); cm.setAttribute('rx', 1); cm.setAttribute('fill', 'var(--ink)'); svg.append(cm);
    if (p.adp != null) { const a = document.createElementNS(svgNS, 'circle'); a.setAttribute('cx', x(p.adp)); a.setAttribute('cy', y); a.setAttribute('r', 6); a.setAttribute('fill', 'none'); a.setAttribute('stroke', 'var(--accent)'); a.setAttribute('stroke-width', '2'); svg.append(a); }
    [[lo, 'start'], [hi, 'end']].forEach(([v, anchor]) => { const t = document.createElementNS(svgNS, 'text'); t.setAttribute('x', anchor === 'start' ? padL : W - padR); t.setAttribute('y', H - 2); t.setAttribute('text-anchor', anchor); t.setAttribute('font-size', '10'); t.setAttribute('fill', 'var(--muted)'); t.setAttribute('font-family', 'inherit'); t.textContent = '#' + v; svg.append(t); });
    const leg = document.createElementNS(svgNS, 'text'); leg.setAttribute('x', W / 2); leg.setAttribute('y', H - 2); leg.setAttribute('text-anchor', 'middle'); leg.setAttribute('font-size', '10'); leg.setAttribute('fill', 'var(--muted)'); leg.textContent = '● source   ▌ composite   ○ ADP'; svg.append(leg);
    return svg;
  }

  // ---------- Draft ----------
  function toggleTaken(id, mine) {
    const isMine = state.mine.includes(id);
    const isTaken = state.taken.has(id);
    if (mine) {
      if (isMine) { state.mine = state.mine.filter(x => x !== id); state.taken.delete(id); }
      else { state.mine.push(id); state.taken.add(id); }
    } else {
      if (isMine) { state.mine = state.mine.filter(x => x !== id); state.taken.delete(id); }
      else if (isTaken) state.taken.delete(id); else state.taken.add(id);

    const ul = el('ul', 'srclist');
    META.sources.forEach(s => {
      const li = el('li'); const l = el('span'); l.append(el('b', null, s.name)); if (s.note) l.append(el('small', null, s.note)); li.append(l); li.append(el('span', 'num', s.count != null ? s.count + ' players' : '')); ul.append(li);
    });
    src.append(ul); root.append(src);
    if (META.unavailable && META.unavailable.length) {
      const u = el('section', 'card');
      u.append(el('p', 'eyebrow', 'Could not reach'), el('h2', null, 'Missing inputs'));
      const ul2 = el('ul', 'list');
      META.unavailable.forEach(t => { const li = el('li'); li.append(el('span', 'n', '•'), el('span', 'note', t)); ul2.append(li); });
      u.append(ul2); root.append(u);
    }
  }

  // ---------- boot ----------
  load();
  seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.textContent === state.pos)));
  renderPlan(); renderBoard(); renderDraft(); renderModel(); updateClock();
  showTab(state.tab);
})();
</script>
