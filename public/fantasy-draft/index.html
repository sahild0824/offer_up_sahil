mposite rank"],"riskWhy":["Sources disagree: \u00b1523.6 places (#145 to #2696)","Missed 3 regular-season games in 2024-25"],"flag":"Reach","note":null}],"strategy":{"headline":"Anchor WR at 4, hero RB at 17, then hammer the WR value pocket","summary":"Every 2026 source agrees on the shape of pick 4: at least one of Gibbs and Bijan is gone, Chase is usually gone, and Puka Nacua is the modal pick. In a 10-team full-PPR room only 20 RBs and 20 WRs start, so the waiver wire is deep and your edge comes from nailing the first two picks and concentrating upside on the bench, not from safe mid-round veterans.","approach":"Anchor WR + Hero RB, flexible. Take the best of Gibbs / Bijan / Chase / Nacua at 4. At 17 take a bell-cow RB from the Achane, Chase Brown, Cook, Kenneth Walker, Hampton, Henry group if one is there; if that whole tier is gone, do not reach: pivot to Bowers / McBride or London / Collins and take RBs at 24 and 37. Then hammer WR in rounds 3-6, take one TE from the Loveland / Warren tier or a round 7-8 TE, and draft QB in the Daniels / Maye / Burrow window at 57-64 only if one falls, otherwise wait for Stafford / Kyler / Baker at 97-124. Draft Sharks' 10-team optimizer prefers full Zero RB from this slot (Nacua, London, Collins, Flowers), while PFF and Fantasy Life say RB is the hardest position to wait on in 2026, so anchoring one back is the compromise most sources land on.","pick4":{"text":"Decision rule at 4: Gibbs, then Bijan, then Chase, then Nacua, then Smith-Njigba. Do not take McCaffrey or Jonathan Taylor here in full PPR: Yahoo calls McCaffrey the worst round-1 pick of 2026 (age 30, 400-plus touches, degraded 49ers weapons). Nacua's noise is real but priced in: he is back at practice, expected for Week 1 in Melbourne, still under NFL review from a civil suit, and in a contract year.","order":[{"player":"Jahmyr Gibbs","why":"Near-unanimous 1.01. Montgomery traded and Pacheco on IR, so the workload only grows."},{"player":"Bijan Robinson","why":"Extension done, Stefanski's run-leaning wide zone. First overall on Yahoo and Sleeper ADP."},{"player":"Ja'Marr Chase","why":"175 and 185 targets the last two years. If he falls to 4 he is an easy pick."},{"player":"Puka Nacua","why":"2025 overall WR1 with 310.5 PPR points, 45 more than St. Brown. The modal pick at 4 across PFF, Draft Sharks, Fantasy Life and 4for4."},{"player":"Jaxon Smith-Njigba","why":"The safe WR alternative if the NFL-review risk on Nacua spooks you."}]},"rounds":[{"pick":4,"round":1,"priority":"WR anchor, or a top-3 back if one falls","targets":["Puka Nacua","Ja'Marr Chase","Bijan Robinson","Jahmyr Gibbs"],"fallback":"Jaxon Smith-Njigba. Never McCaffrey or Taylor in full PPR."},{"pick":17,"round":2,"priority":"Bell-cow RB anchor","targets":["De'Von Achane","Chase Brown","James Cook","Kenneth Walker III","Omarion Hampton","Derrick Henry"],"fallback":"Brock Bowers or Trey McBride (ADP 21-23), or Drake London / Nico Collins, then RBs at 24 and 37. Avoid Jeanty (ankle, biggest coin flip of round 2) and Love at this price."},{"pick":24,"round":3,"priority":"WR1 if you took a back at 17; RB if you pivoted","targets":["Malik Nabers","A.J. Brown","Drake London","Nico Collins","Saquon Barkley","Breece Hall"],"fallback":"Josh Allen only if both the RB and WR tiers are gone; in a 10-teamer, pass. Avoid Kyren Williams (Corum splits drives) and Etienne at round-3 cost."},{"pick":37,"round":4,"priority":"WR value pocket, or second RB","targets":["Zay Flowers","Garrett Wilson","Brian Thomas Jr.","DK Metcalf","Emeka Egbuka","Tetairoa McMillan","Colston Loveland"],"fallback":"Breece Hall (small reach), TreVeyon Henderson, RJ Harvey. Judkins only if you accept the fibula risk."},{"pick":44,"round":5,"priority":"Fill RB2 / WR3, or tier-2 TE","targets":["Colston Loveland","Tyler Warren","Quinshon Judkins","David Montgomery","Emeka Egbuka","Travis Hunter","Rome Odunze"],"fallback":"Lamar Jackson (ADP 45) is fine here only if RB and WR are already set. Skattebo is overpriced at ADP."},{"pick":57,"round":6,"priority":"QB value window opens","targets":["Jayden Daniels","Drake Maye","Joe Burrow","MarShawn Lloyd","Bucky Irving","Chris Godwin"],"fallback":"If the QBs are gone, take the best RB with a path to volume (Lloyd is the Jacobs-exempt-list beneficiary) and get QB at 64 or 97."},{"pick":64,"round":7,"priority":"QB or TE, whichever is the better value","targets":["Jayden Daniels","Jalen Hurts","Caleb Williams","Tucker Kraft","Sam LaPorta","Harold Fannin Jr."],"fallback":"Chris Godwin, Josh Downs, Stefon Diggs if he is climbing."},{"pick":77,"round":8,"priority":"Second TE tier or RB upside","targets":["Tucker Kraft","Sam LaPorta","Harold Fannin Jr.","Caleb Williams","Bhayshul Tuten","Carnell Tate"],"fallback":"Whichever of TE or QB you still lack."},{"pick":84,"round":9,"priority":"Handcuffs with standalone value","targets":["Blake Corum","Tyler Allgeier","George Kittle","Stefon Diggs"],"fallback":"Corum out-efficiencies Kyren; Allgeier starts if Love misses Week 1 and keeps a role after."},{"pick":97,"round":10,"priority":"QB if you waited; sleeper WR","targets":["Matthew Stafford","Stefon Diggs","George Kittle"],"fallback":"Yahoo: you can wait until round 9 or 10 for a viable starter."},{"pick":104,"round":11,"priority":"Upside QB2 or RB lottery ticket","targets":["Kyler Murray","Rachaad White","Keaton Mitchell"],"fallback":"Kyler has a rushing floor and Jefferson / Addison; Mitchell is the explosive change-of-pace behind Hampton under McDaniel."},{"pick":117,"round":12,"priority":"Second QB or another RB dart","targets":["Baker Mayfield","Bo Nix","Jaxson Dart","Mike Washington Jr.","Kaelon Black"],"fallback":"Dart only as a QB2 at his price."},{"pick":124,"round":13,"priority":"Rookie WR / TE2 darts","targets":["Caleb Douglas","Ja'Kobi Lane","Chris Rodriguez Jr."],"fallback":"Douglas is already in Miami's first-team offense; Lane is a 6-4 red-zone target for Lamar."},{"pick":137,"round":14,"priority":"Last skill dart","targets":["De'Zhaun Stribling","Greg Dulcich","Gunnar Helm","Jordan Mason","Isaiah Likely"],"fallback":"Stribling: 11 catches for 109 yards in two preseason games in a thin 49ers room."},{"pick":144,"round":15,"priority":"Defense with a soft early schedule","targets":[],"fallback":"Stream it after week 3."},{"pick":157,"round":16,"priority":"Kicker, last","targets":[],"fallback":"No 2026 source argues otherwise for a 10-team league."}],"qbte":"QB: late-round QB is still the consensus in one-QB leagues. Only 10 QBs start, so the replacement level (Nix, Dart, Stafford, Kyler) sits close to the QB5-8 tier. Josh Allen is the clear QB1 at ADP 26-35 but Mike Clay questions the round-3 opportunity cost; Jayden Daniels goes three rounds later and could out-score him. The cheap way to buy a QB edge in a 10-teamer is Daniels / Maye / Burrow at 57-64, never Allen at 24. TE: Bowers (ADP 21) and McBride (22.5) are the elite tier; ESPN says round 1-2 is too early for a TE in 10-team leagues but warns neither lasts to round 3. Loveland (41) and Warren (52.5) are tier 2; Kraft, LaPorta and Fannin at 74-81 are the 10-team sweet spot; Kittle at 98 carries Achilles risk. Take an elite TE at 17 only if the RB anchor tier is gone.","rules":["At 4, take Nacua unless Gibbs, Bijan or Chase falls. Never McCaffrey in full PPR.","Anchor one bell-cow RB at 17: Achane, Chase Brown, Cook, Kenneth Walker, Hampton or Henry. RB is the hardest position to wait on in 2026.","If that RB tier is gone at 17, do not reach. Pivot to Bowers / McBride or London / Collins and take RBs at 24 and 37.","Hammer WR in rounds 3-6. That is the value pocket: Nabers, A.J. Brown, Flowers, Thomas Jr., Metcalf, Egbuka, McMillan.","Pay for an elite TE only as a pivot, never as the plan. Loveland in round 4 or Kraft / LaPorta / Fannin in rounds 7-8 is the 10-team sweet spot.","QB in the 57-64 window (Daniels, Maye, Burrow, Hurts) or wait until 97-124 (Stafford, Kyler, Baker). Do not pay the Allen tax at 24.","Fade the 2026 landmines at ADP: McCaffrey, Jeanty, Love, Kyren Williams, Etienne, Judkins, Skattebo, Tate, Davante Adams.","Buy this week's news: MarShawn Lloyd (Jacobs on the exempt list), Allgeier (Love's ankle), Corum (Kyren's drive split).","Bench equals upside only. In a 10-teamer the waiver wire replaces safe veterans, so spend picks 104-137 on rookies and handcuffs with a path to volume.","Kicker and defense in the last two rounds, and mock from picks 2, 7 and 12 before draft night so you know the turns."],"sleepers":["MarShawn Lloyd","Tyler Allgeier","Blake Corum","Stefon Diggs","Keaton Mitchell","Rachaad White","Caleb Douglas","Ja'Kobi Lane","Chris Rodriguez Jr.","De'Zhaun Stribling","Kyler Murray","Baker Mayfield","Cam Ward","Tyler Shough","Josh Downs","Jordan Mason","Isaiah Likely"],"avoids":["Christian McCaffrey","Ashton Jeanty","Jeremiyah Love","Kyren Williams","Travis Etienne","Quinshon Judkins","Bucky Irving","Cam Skattebo","Carnell Tate","Davante Adams","Mike Evans","Jaxson Dart"],"reddit":["Reddit's 2026 consensus build (via Fantasy Squawk's roundup of r/fantasyfootball drafters) is robust RB: two backs in the first three rounds, WRs in rounds 4-7, QB punted to round 8 or later. That is more RB-heavy than the PPR expert plans for this slot, which open WR at 4.","Jeremiyah Love: crowd ADP has him RB13 while expert consensus is RB16. The community is buying the No. 3 overall pick's talent; most experts except Mike Clay see an ADP trap in Arizona.","Ashton Jeanty: the crowd keeps him around pick 20 while Yahoo calls him the worst round-2 pick.","Bowers vs McBride: the crowd flipped to Bowers on the Cousins upgrade; FantasySP and ESPN's Matt Bowen still prefer McBride's record 169-target volume.","Josh Allen: crowd ADP pushes him to about 26 in some rooms versus 35 in others, a tax the experts say not to pay in a one-QB league.","Where they agree: Gibbs 1.01, Nacua at 4 in PPR, punt K and DST, and treat 10-team waivers as a resource.","Caveat: reddit.com could not be fetched from this environment, so Reddit sentiment is secondhand and no quotes are reproduced. Search r/fantasyfootball for the Sept 1-4 draft-help threads before your draft."]},"meta":{"updated":"2026-09-05","sourceNames":{"fantasypros_ecr":"FantasyPros ECR","espn":"ESPN (3 boards)","yahoo":"Yahoo (Winks, Boone)","rotowire":"RotoWire","rotoballer":"RotoBaller","draftsharks":"Draft Sharks","flock":"Flock consensus","nbc_rotoworld":"NBC / Rotoworld","lineupexperts":"LineupExperts","fftoday":"FFToday (Krueger)","prizepicks":"PrizePicks (Hardy)","bleacher_report":"Bleacher Report","etr":"Establish The Run ($)","bdge":"BDGE top 50","subvertadown":"Subvertadown board","sleeper_rank":"Sleeper default","fantasylife_jul":"Fantasy Life (Jul 28)","fourfor4_jul":"4for4 (Jul 27)","cbs_aug3":"CBS (Aug 3)"},"adpNames":{"sleeper_ppr":"Sleeper","nfc_ppr":"FF Calculator","espn":"ESPN","yahoo":"Yahoo","underdog":"Underdog (\u00bd PPR)","ffpc":"FFPC (TE prem.)","fantasypros_cbs":"CBS","fantasypros_rtsports":"RTSports","fantasypros_fantrax":"Fantrax","draftsharks_half_consensus":"Draft Sharks (\u00bd PPR)"},"sources":[{"key":"fantasypros_ecr","name":"FantasyPros Expert Consensus (PPR overall)","note":"Sept 4 \u00b7 weight 2 \u00b7 via DynastyProcess mirror","count":253},{"key":"espn","name":"ESPN PPR-300 sheet, default draft rank, Aug 24 snapshot","note":"Sept 4 \u00b7 averaged into one ESPN number","count":250},{"key":"yahoo","name":"Yahoo: Hayden Winks and Justin Boone","note":"Sept 4 \u00b7 averaged","count":252},{"key":"rotoballer","name":"RotoBaller PPR rankings","note":"Sept 2","count":251},{"key":"flock","name":"Flock Fantasy expert consensus","note":"Aug 31","count":252},{"key":"fftoday","name":"FFToday, Mike Krueger","note":"Aug 30 \u00b7 weight 0.75","count":199},{"key":"prizepicks","name":"PrizePicks, Christian Hardy top 200","note":"Aug 29 \u00b7 weight 0.75","count":175},{"key":"rotowire","name":"RotoWire expert consensus and value rank","note":"Aug 26 \u00b7 averaged","count ","name":"Projections: CBS stat lines to PPR","note":"2026 season","count":222},{"key":"ffa","name":"Projections: ffanalytics floor, ceiling, uncertainty, age","note":"standard scoring, used as ratios","count":189},{"key":"risk","name":"Boom / bust / injury citations: ~70 articles (FantasyPros, Yahoo, ESPN, CBS, PFF, SI, RotoBaller, RotoWire, NBC, Bleacher Report, Fantasy Points, 4for4, FTN)","note":"from search summaries \u00b7 research/risk_sources.md","count":117},{"key":"context","name":"2026 context: trades, coaching changes, injuries, depth charts","note":"research/context.md","count":63},{"key":"nflverse","name":"nflverse: 2024-25 weekly player stats, 2026 Week 1 rosters, player birthdates","note":"GitHub release assets \u00b7 boom/bust rates, usage, ages, status codes, vacated volume","count":253},{"key":"sos","name":"2026 schedule strength by position (weeks 1-17, 1-4, 15-17)","note":"computed from nflverse 2024-25 points allowed, schedule-adjusted \u00b7 research/sos_notes.md","count":253},{"key":"team_env","name":"2026 team environments: coaches, play-callers, QBs, Vegas, O-line","note":"research/team_env_notes.md"},{"key":"opportunity","name":"2026 per-player opportunity change drivers","note":"research/opportunity_notes.md"}],"unavailable":["Direct page fetches were blocked for every fantasy site in this environment (FantasyPros, ESPN, Yahoo, CBS, NFL.com, PFF, Draft Sharks, Fantasy Football Calculator, Sleeper API) and for reddit.com. Rankings and ADP come from public GitHub mirrors of those sites with verified dates; article findings come from search-result summaries.","Not obtained at all: PFF rankings, NFL.com (Fabiano / Grant), ESPN individual analysts (Clay, Karabell, Yates), current CBS (Eisenberg / Richard), The Athletic, FTN / numberFire, Fantasy Points, Footballguys.","Reddit threads could not be read. Community sentiment is secondhand (Fantasy Squawk's roundup) and from ADP-versus-expert gaps.","Draft Sharks injury percentages exist only for McCaffrey (78%); everyone else uses games missed in 2024-25 from nflverse plus reported labels.","Weekly boom/bust rates now come from nflverse game logs; they still cannot capture 2026 role changes for players who moved."],"model":{"intro":"Every number in this app is built from public rankings, ADP feeds and projections compiled on September 4, 2026, scored with methods borrowed from FantasyPros, ffanalytics, Boris Chen's tiers and Draft Sharks. Nothing is a gut call: the same inputs always produce the same scores, and each player's sheet lists the signals behind his numbers.","sections":[{"title":"Composite rank","paras":["Nineteen outlets contribute an overall PPR rank. Where an outlet published more than one list (three ESPN boards, two RotoWire, two Yahoo analysts) those are averaged first so no publisher counts twice. The FantasyPros Expert Consensus counts double because it already aggregates 100-plus experts. Platform default orders (Sleeper), value-model boards and July snapshots count half.","Best and worst are the most bullish and most bearish placements across every outlet plus the FantasyPros best/worst expert. Spread is the weighted standard deviation of outlet ranks: the size of the argument about a player."],"formula":"composite = \u03a3(w_outlet \u00b7 rank_outlet) / \u03a3 w_outlet\nw = 2.0 FantasyPros ECR \u00b7 1.0 ESPN, Yahoo, RotoWire, RotoBaller, Draft Sharks, Flock, NBC\n    0.75 LineupExperts, FFToday, PrizePicks, Bleacher Report, ETR \u00b7 0.5 Sleeper, Subvertadown, BDGE, July lists"},{"title":"Tiers","paras":["Within each position, a new tier starts when the composite has dropped, since the tier began, by more than the local cross-source spread (the median spread of the ten neighbouring players), or when a single gap exceeds three quarters of that. This is the ffanalytics tier rule applied to ranks; tiers widen deeper in the draft because experts disagree more there."],"formula":"new tier if (comp_i \u2212 comp_tierStart) > T_i  or  (comp_i \u2212 comp_i\u22121) > 0.75\u00b7T_i\nT_i = max(3, median spread of players i\u22125 \u2026 i+5 at the position)"},{"title":"ADP and value","paras":["ADP is a weighted mean of 22 feeds. Full-PPR redraft platforms (Sleeper, ESPN, Yahoo, Fantasy Football Calculator, the FantasyPros consensus) count fully; half-PPR best-ball (Underdog), TE-premium (FFPC) and older snapshots count half or less. ADP spread is the standard deviation across the ten platform-level feeds.","Value is ADP minus composite in picks: positive means the market lets him fall past where the experts rank him. The log-space score (jeisey's form) treats a rank-20 player with ADP 40 the same as a rank-80 player with ADP 160."],"formula":"value = ADP \u2212 composite\nvalueScore = 50 + 50 \u00b7 tanh( ln(ADP / composite) / ln 2 )"},{"title":"Boom (0-100)","paras":["Boom is a within-position percentile, so 80 means more upside signal than 80 percent of players at his position. Inputs: the player's own 2024-25 boom-week rate (weeks at or above the weekly RB6 / WR6 / QB3 / TE3 score, from nflverse game logs, 2025 weighted 0.65), how far the most bullish source sits above the composite (FantasyPros' upside disagreement), the ffanalytics ceiling-to-projection ratio, breakout and sleeper citations across 2026 articles (saturating so ten mentions beat three), situational boom factors from the context research, youth relative to the positional age curve, and positive ADP value."],"formula":"raw = .20\u00b7pct(upside) + .10\u00b7pct(ceiling gap) + .20\u00b7pct(2024-25 boom-week rate) + .20\u00b7sat(boom mentions)\n      + .10\u00b7sat(boom factors) + .10\u00b7youth + .10\u00b7clamp(value/10) + .12\u00b7situation\u207a + context adjustment\nboom = percentile of raw within position        sat(n) = 1 \u2212 e^(\u2212n/3)"},{"title":"Bust (0-100)","paras":["Bust is the directional downside, also as a within-position percentile. Inputs: the player's own 2024-25 bust-week rate (weeks at or below the weekly RB40 / WR56 / QB18 / TE18 score), how far the most bearish source sits below the composite, the ffanalytics floor gap, bust and avoid-at-ADP citations, structural risk factors (committee, new QB, workload), an age flag at the historical cliff (RB 27 and 29, WR 29 and 31, TE 30 and 32, QB 34 and 36), a reach penalty when ADP runs ahead of the composite, and injury history. Players on IR, PUP or the exempt list get a large hand adjustment."],"formula":"raw = .10\u00b7pct(downside) + .10\u00b7pct(floor gap) + .15\u00b7pct(2024-25 bust-week rate) + .20\u00b7sat(bust mentions) + .15\u00b7sat(risk factors)\n      + .10\u00b7ageFlag + .05\u00b7clamp(\u2212value/10) + .15\u00b7injury + .12\u00b7situation\u207b + context adjustment\nbust = percentile of raw within position"},{"title":"Risk / volatility (0-100)","paras":["Risk is symmetric uncertainty, following Isaac Petersen's ffanalytics measure: spread of expert ranks, spread of ADP across platforms and the ffanalytics projection uncertainty, plus the player's own 2025 week-to-week variation (coefficient of variation from game logs), injury signal (games missed in 2024-25 from nflverse, blended with reported injury labels; position base rate only for rookies), camp status from the Week 1 roster codes, and situation changes including an unresolved 2026 role. High risk with high boom and low bust is a target; high risk with high bust is a fade."],"formula":"raw = .20\u00b7pct(rank spread) + .10\u00b7pct(ADP spread) + .10\u00b7uncertainty + .15\u00b7pct(2025 weekly CV) + .20\u00b7injury\n      + .10\u00b7camp + .15\u00b7sat(situation changes, 2) + .10\u00b7unresolved + context adjustment\nrisk = percentile of raw within position"},{"title":"2026 situation (0-100)","paras":["Experts and ADP already price the headline moves (A.J. Brown to New England, Kenneth Walker to Kansas City), so this layer does not move the composite rank. It scores what the market prices least and widens or narrows the range of outcomes. Four parts: team offensive environment (Vegas implied points, quarterback tier, offensive line, play-caller pass-rate and backfield tendencies, from the 2026 coaching research), the player's 2026 change (opportunity, competition, quarterback and coaching change from the opportunity research, with an unresolved flag), vacated volume (share of the team's 2025 targets or carries that left, computed from nflverse 2025 stats and the Week 1 2026 roster; only ever adds, since low churn is stable rather than bad), and schedule (2026 strength of schedule by position from nflverse 2024-25 points allowed, schedule-adjusted; fantasy playoff weeks 15-17 weigh more than the full season because the research finds full-season schedule strength is close to noise).","The situation score is a within-position percentile. Positive situation raw adds to boom, negative adds to bust, and an unresolved role adds to risk. The scenario runner uses it as a tiebreak (0.10 log-rank units per 100 points) along with the playoff-schedule z-score (0.04 per z)."],"formula":"raw = .35\u00b7environment + .35\u00b7change + .15\u00b7vacated + .15\u00b7(0.4\u00b7SOS_full_z + 0.6\u00b7SOS_playoffs_z)\nenvironment(WR/TE) = .40\u00b7z(Vegas pts) + .35\u00b7QB tier + .10\u00b7z(O-line) + .15\u00b7pass-rate lean\nenvironment(RB)    = .40\u00b7z(Vegas pts) + .10\u00b7QB tier + .25\u00b7z(O-line) \u2212 .10\u00b7pass-rate lean + .15\u00b7bell-cow lean\nchange = (.5\u00b7opportunity + .25\u00b7competition + qb_w\u00b7QB + .25\u00b7coaching) / 2,  qb_w = .5 WR/TE, .25 RB\nsituation = percentile of raw within position"},{"title":"Projection and VBD","paras":["ESPN and CBS stat-line projections are converted to full-PPR points (1 per reception, 6 per TD, 0.1 per yard, 4 per passing TD, \u22122 per INT and fumble) and averaged. VBD is points over the 10-team replacement baseline: the 10th QB, 22nd RB, 28th WR and 10th TE by projection, the VOLS-plus-flex baseline from the methodology research. Use it to compare across positions at a pick; use composite to compare within one."],"formula":"proj = mean(ESPN PPR, CBS PPR)\nVBD = proj \u2212 proj(baseline player at position)   baselines QB10 \u00b7 RB22 \u00b7 WR28 \u00b7 TE10"},{"title":"Chance he is there at your pick","paras":["A logistic curve around ADP whose width grows with ADP spread and with pick number, since later picks are noisier. The Draft tab uses your league size and slot; the defaults are 10 teams and slot 4 (picks 4, 17, 24, 37, 44, 57, 64, 77, 84, 97, 104, 117, 124, 137, 144, 157)."],"formula":"P(available at pick N) = 1 / (1 + e^((N \u2212 ADP) / s))\ns = max(1.6, 0.55 \u00b7 max(ADP spread, 0.15 \u00b7 ADP))"}]},"weights":{"boom":{"upside":0.2,"ceiling":0.1,"hist_boom":0.2,"mentions":0.2,"factors":0.1,"youth":0.1,"value":0.1},"bust":{"downside":0.1,"floor":0.1,"hist_bust":0.15,"mentions":0.2,"factors":0.15,"age":0.1,"reach":0.05,"injury":0.15},"risk":{"spread":0.2,"adp_spread":0.1,"uncertainty":0.1,"consistency":0.15,"injury":0.2,"camp":0.1,"situation":0.15}},"situationWeights":{"env":0.35,"change":0.35,"vacated":0.15,"schedule":0.15},"outletWeights":{"fantasypros_ecr":2.0,"sleeper_rank":0.5,"subvertadown":0.5,"bdge":0.5,"etr":0.75,"fantasylife_jul":0.5,"fourfor4_jul":0.5,"cbs_aug3":0.5,"lineupexperts":0.75,"fftoday":0.75,"prizepicks":0.75,"bleacher_report":0.75},"baselines":{"QB":10,"RB":22,"WR":28,"TE":10}}}
</script>
<script>
(function () {
  'use strict';
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const PLAYERS = DATA.players;
  const STRATEGY = DATA.strategy;
  const META = DATA.meta;
  const byId = new Map(PLAYERS.map(p => [p.id, p]));
  const normName = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/['.]/g, '').replace(/-/g, ' ').replace(/\b(jr|sr|ii|iii|iv)\b/g, '').replace(/\s+/g, ' ').trim();
  const byName = new Map(PLAYERS.map(p => [normName(p.name), p]));
  const findPlayer = name => byName.get(normName(name));
  const POS = ['ALL', 'QB', 'RB', 'WR', 'TE'];

  // ---------- state ----------
  const state = { tab: 'plan', pos: 'ALL', sort: 'comp', q: '', taken: new Set(), mine: [], teams: 10, slot: 4 };
  const KEY = 'fourth-pick-war-room';
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (s) {
        state.taken = new Set(s.taken || []);
        state.mine = s.mine || [];
        state.teams = s.teams || 10;
        state.slot = s.slot || 4;
        state.tab = s.tab || 'plan';
      }
    } catch (e) { /* storage unavailable: run in memory */ }
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ taken: [...state.taken], mine: state.mine, teams: state.teams, slot: state.slot, tab: state.tab }));
    } catch (e) { /* ignore */ }
  }

  // ---------- helpers ----------
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const fmt1 = v => (v == null ? '–' : (Math.round(v * 10) / 10).toFixed(1));
  const fmt0 = v => (v == null ? '–' : String(Math.round(v)));
  const signed = v => (v == null ? '–' : (v > 0 ? '+' : '') + fmt1(v));
  const signed0 = v => (v == null ? '–' : (v > 0 ? '+' : '') + fmt0(v));
  const ordinal = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 > 10 && n % 100 < 14) ? 0 : Math.min(n % 10, 4) % 4] || 'th');
  function myPicks(teams, slot, rounds) {
    const out = [];
    for (let r = 1; r <= rounds; r++) out.push(r % 2 ? (r - 1) * teams + slot : r * teams - slot + 1);
    return out;
  }
  // Probability a player is still on the board at overall pick p, from ADP.
  // Logistic around ADP; the spread widens as ADP grows (later picks are noisier).
  function pAvail(adp, p, adpSd) {
    if (adp == null) return null;
    const s = Math.max(1.6, 0.55 * Math.max(adpSd || 0, 0.15 * adp));
    return 1 / (1 + Math.exp((p - adp) / s));
  }
  function nextPickInfo() {
    const picks = myPicks(state.teams, state.slot, 16);
    const made = state.mine.length;
    const cur = state.taken.size + 1;
    const next = picks[made] != null ? picks[made] : null;
    return { picks, made, cur, next, until: next != null ? next - cur : null };
  }

  // ---------- meters ----------
  function meter(kind, label, val, big) {
    const m = el('div', 'meter ' + kind + (big ? ' big' : ''));
    const lab = el('div', 'lab'); lab.append(el('span', null, label), el('b', null, fmt0(val)));
    const track = el('div', 'track'); const fill = el('div', 'fill'); fill.style.width = Math.max(0, Math.min(100, val || 0)) + '%';
    track.append(fill); m.append(lab, track);
    m.setAttribute('role', 'img'); m.setAttribute('aria-label', label + ' ' + fmt0(val) + ' out of 100');
    return m;
  }
  function posChip(pos) { return el('span', 'pos ' + pos, pos); }

  // ---------- tabs ----------
  const tabsNav = document.querySelector('.tabs');
  tabsNav.addEventListener('click', e => {
    const b = e.target.closest('button[data-tab]'); if (!b) return;
    showTab(b.dataset.tab);
  });
  function showTab(name) {
    state.tab = name; save();
    if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
    tabsNav.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
    ['plan', 'board', 'draft', 'model'].forEach(t => { document.getElementById('tab-' + t).hidden = t !== name; });
    if (name === 'draft') renderDraft();
    if (name === 'board') renderBoard();
    window.scrollTo(0, 0);
  }

  // ---------- Plan ----------
  function renderPlan() {
    const root = document.getElementById('tab-plan'); root.replaceChildren();
    const s = STRATEGY;

    const hero = el('section', 'card');
    hero.append(el('p', 'eyebrow', 'The read'), el('h2', null, s.headline));
    hero.append(el('p', 'lede', s.summary));
    if (s.approach) { hero.append(el('hr', 'divider')); const a = el('p', 'note'); a.append(el('b', null, 'Roster build: '), document.createTextNode(s.approach)); hero.append(a); }
    root.append(hero);

    const at4 = el('section', 'card');
    at4.append(el('p', 'eyebrow', 'Who will be there at 4'), el('h2', null, 'The pick-4 decision'));
    at4.append(el('p', 'note', s.pick4.text));
    const order = el('ol', 'list');
    s.pick4.order.forEach((o, i) => {
      const li = el('li'); li.append(el('span', 'n', String(i + 1)));
      const body = el('div'); const nm = playerLink(o.player); body.append(nm);
      body.append(el('div', 'note', o.why)); li.append(body); order.append(li);
    });
    at4.append(order);
    root.append(at4);

    const rounds = el('section', 'card');
    rounds.append(el('p', 'eyebrow', 'Round by round · picks ' + myPicks(10, 4, 16).slice(0, 8).join(' · ') + ' …'), el('h2', null, 'The plan'));
    s.rounds.forEach(r => {
      const row = el('div', 'round');
      const pk = el('div', 'pick'); pk.append(el('b', null, '#' + r.pick), el('span', null, 'Rd ' + r.round)); row.append(pk);
      const body = el('div');
      body.append(el('div', 'pri', r.priority));
      const chips = el('div', 'chips');
      r.targets.forEach(n => chips.append(playerChip(n)));
      body.append(chips);
      if (r.fallback) { const f = el('p', 'note'); f.append(el('b', null, 'If gone: '), document.createTextNode(r.fallback)); f.style.marginTop = '6px'; body.append(f); }
      row.append(body); rounds.append(row);
    });
    root.append(rounds);

    const qbte = el('section', 'card');
    qbte.append(el('p', 'eyebrow', 'Onesies'), el('h2', null, 'QB and TE timing'));
    qbte.append(el('p', 'note', s.qbte));
    root.append(qbte);

    const rules = el('section', 'card');
    rules.append(el('p', 'eyebrow', 'Cheat sheet'), el('h2', null, 'Ten rules for this draft'));
    const rl = el('ol', 'list');
    s.rules.forEach((r, i) => { const li = el('li'); li.append(el('span', 'n', String(i + 1)), el('span', null, r)); rl.append(li); });
    rules.append(rl); root.append(rules);

    const targets = el('section', 'card');
    targets.append(el('p', 'eyebrow', 'Late rounds'), el('h2', null, 'Targets and avoids'));
    const t1 = el('p', 'note'); t1.append(el('b', null, 'Target at ADP: ')); targets.append(t1);
    const c1 = el('div', 'chips'); s.sleepers.forEach(n => c1.append(playerChip(n))); targets.append(c1);
    const t2 = el('p', 'note'); t2.append(el('b', null, 'Avoid at ADP: ')); t2.style.marginTop = '12px'; targets.append(t2);
    const c2 = el('div', 'chips'); s.avoids.forEach(n => c2.append(playerChip(n))); targets.append(c2);
    root.append(targets);

    const reddit = el('section', 'card');
    reddit.append(el('p', 'eyebrow', 'Where the crowd and the experts split'), el('h2', null, 'Reddit vs. the sites'));
    const ul = el('ul', 'list');
    s.reddit.forEach(r => { const li = el('li'); li.append(el('span', 'n', '•'), el('span', 'note', r)); ul.append(li); });
    reddit.append(ul); root.append(reddit);
  }
  function playerLink(name) {
    const p = findPlayer(name);
    const b = el('button', 'chip'); b.type = 'button';
    if (p) { b.append(el('span', 'dot ' + p.pos), el('b', null, p.name), el('span', null, '#' + fmt1(p.comp))); b.addEventListener('click', () => openSheet(p.id)); }
    else b.append(el('b', null, name));
    return b;
  }
  function playerChip(name) {
    const p = findPlayer(name);
    const b = el('button', 'chip' + (p && state.taken.has(p.id) ? ' taken' : '')); b.type = 'button';
    if (p) { b.append(el('span', 'dot ' + p.pos), document.createTextNode(p.name), el('span', 'num', fmt1(p.comp))); b.addEventListener('click', () => openSheet(p.id)); }
    else b.append(document.createTextNode(name));
    return b;
  }

  // ---------- Board ----------
  const seg = document.getElementById('posSeg');
  POS.forEach(p => { const b = el('button', null, p); b.type = 'button'; b.setAttribute('aria-pressed', String(p === state.pos)); b.addEventListener('click', () => { state.pos = p; seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.textContent === p))); renderBoard(); }); seg.append(b); });
  document.getElementById('q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); renderBoard(); });
  document.getElementById('sort').addEventListener('change', e => { state.sort = e.target.value; renderBoard(); });

  function sorted(list) {
    const k = state.sort;
    const cmp = {
      comp: (a, b) => a.comp - b.comp,
      boom: (a, b) => b.boom - a.boom || a.comp - b.comp,
      bust: (a, b) => b.bust - a.bust || a.comp - b.comp,
      risk: (a, b) => b.risk - a.risk || a.comp - b.comp,
      sit: (a, b) => (b.sit ?? 0) - (a.sit ?? 0) || a.comp - b.comp,
      value: (a, b) => (b.value ?? -99) - (a.value ?? -99) || a.comp - b.comp,
      adp: (a, b) => (a.adp ?? 999) - (b.adp ?? 999),
      vbd: (a, b) => (b.vbd ?? -999) - (a.vbd ?? -999) || a.comp - b.comp,
    }[k];
    return list.slice().sort(cmp);
  }
  function filtered() {
    return PLAYERS.filter(p => (state.pos === 'ALL' || p.pos === state.pos) && (!state.q || p.name.toLowerCase().includes(state.q) || p.team.toLowerCase() === state.q));
  }
  function renderBoard() {
    const ul = document.getElementById("boardList"); ul.replaceChildren();
    const list = sorted(filtered());
    if (!list.length) { ul.append(el('li', 'empty', 'No players match.')); return; }
    const frag = document.createDocumentFragment();
    list.forEach(p => frag.append(playerRow(p, false)));
    ul.append(frag);
  }
  function playerRow(p, draftMode) {
    const li = el('li');
    const b = el('button', 'prow' + (state.taken.has(p.id) ? ' taken' : '') + (state.mine.includes(p.id) ? ' mine' : '')); b.type = 'button';
    b.append(el('span', 'rank num', String(p.posRank)));
    const name = el('span', 'name'); name.append(el('span', 't', p.name), posChip(p.pos)); b.append(name);
    const comp = el('span', 'comp num', fmt1(p.comp)); comp.append(el('small', null, 'Comp')); b.append(comp);
    const meta = el('span', 'meta');
    meta.append(metaBit('', p.team + ' · bye ' + p.bye));
    meta.append(metaBit('ADP', fmt1(p.adp)));
    meta.append(metaBit('Val', signed(p.value)));
    if (p.vbd != null) meta.append(metaBit('VBD', signed0(p.vbd)));
    meta.append(metaBit('Tier', String(p.tier)));
    if (p.flag) meta.append(el('span', 'flag', p.flag));
    b.append(meta);
    const ms = el('span', 'meters'); ms.append(meter('boom', 'Boom', p.boom), meter('bust', 'Bust', p.bust), meter('risk', 'Risk', p.risk), meter('sit', '2026', p.sit)); b.append(ms);
    b.addEventListener('click', () => openSheet(p.id));
    li.append(b);
    return li;
  }
  function metaBit(k, v) { const s = el('span'); if (k) { s.append(document.createTextNode(k + ' ')); } s.append(el('b', 'num', v)); return s; }

  // ---------- Sheet ----------
  const sheet = document.getElementById('sheet');
  sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });
  function closeSheet() { sheet.hidden = true; sheet.replaceChildren(); document.body.style.overflow = ''; }
  function openSheet(id) {
    const p = byId.get(id); if (!p) return;
    sheet.replaceChildren();
    const panel = el('div', 'panel'); panel.setAttribute('role', 'dialog'); panel.setAttribute('aria-label', p.name);
    panel.append(el('div', 'grab'));
    const head = el('div', 'sheet-head');
    const hl = el('div'); hl.append(el('h2', null, p.name));
    const sub = el('div', 'sub'); sub.append(posChip(p.pos), el('span', null, p.pos + String(p.posRank) + ' · ' + p.team + ' · bye ' + p.bye + (p.age ? ' · age ' + p.age : '')));
    hl.append(sub); head.append(hl);
    const x = el('button', 'close', '×'); x.type = 'button'; x.setAttribute('aria-label', 'Close'); x.addEventListener('click', closeSheet); head.append(x);
    panel.append(head);

    const tiles = el('div', 'tiles');
    tiles.append(tile('Composite', fmt1(p.comp), p.n + ' outlets · tier ' + p.tier), tile('ADP', fmt1(p.adp), p.adpSd != null ? '±' + fmt1(p.adpSd) + ' across sites' : 'no data'), tile('Value', signed(p.value), p.value == null ? '' : (p.value >= 0 ? 'falls past rank' : 'market reaches'), p.value == null ? '' : (p.value >= 1.5 ? 'up' : p.value <= -1.5 ? 'down' : '')));
    tiles.append(tile('Proj pts', p.proj == null ? '–' : String(p.proj), p.ceilPts ? 'floor ' + p.floorPts + ' · ceil ' + p.ceilPts : 'no projection'), tile('VBD', signed0(p.vbd), 'over ' + p.pos + (META.baselines ? META.baselines[p.pos] : '') + ' baseline', p.vbd == null ? '' : (p.vbd >= 40 ? 'up' : p.vbd <= 0 ? 'down' : '')), tile('Spread', '±' + fmt1(p.sd), '#' + fmt0(p.best) + ' to #' + fmt0(p.worst)));
    panel.append(tiles);

    const big = el('div', 'stack');
    big.append(meter('boom', 'Boom', p.boom, true), meter('bust', 'Bust', p.bust, true), meter('risk', 'Risk / volatility', p.risk, true), meter('sit', '2026 situation', p.sit, true));
    panel.append(big);

    if (p.hist && p.hist.games25) {
      const h = p.hist; const u = el('div', 'sec'); u.append(el('h3', null, '2025 in numbers'));
      const bits = [h.games25 + ' games', fmt1(h.ppg25) + ' PPR/game'];
      if (p.pos === 'RB') { bits.push(h.carries25 + ' carries' + (h.carryShare25 != null ? ' (' + Math.round(h.carryShare25 * 100) + '% of team)' : '')); bits.push(h.targets25 + ' targets'); }
      else if (p.pos === 'QB') { bits.push(h.carries25 + ' rushes'); }
      else { bits.push(h.targets25 + ' targets' + (h.tgtShare25 != null ? ' (' + Math.round(h.tgtShare25 * 100) + '% share)' : '')); }
      if (h.boomRate != null) bits.push('boom weeks ' + Math.round(h.boomRate * 100) + '%');
      if (h.bustRate != null) bits.push('bust weeks ' + Math.round(h.bustRate * 100) + '%');
      if (h.gamesMissed) bits.push('missed ' + h.gamesMissed + ' games 2024-25');
      u.append(el('p', 'note', bits.join(' · '))); panel.append(u);
    } else if (p.hist && p.hist.rookie) {
      const u = el('div', 'sec'); u.append(el('h3', null, 'Rookie')); u.append(el('p', 'note', 'No NFL usage history.' + (p.hist.draftNo ? ' Drafted ' + ordinal(p.hist.draftNo) + ' overall.' : ''))); panel.append(u);
    }

    const sit = el('div', 'sec'); sit.append(el('h3', null, '2026 situation'));
    const sk = el('dl', 'kv');
    const kv = (k, v) => { if (v == null || v === '') return; sk.append(el('dt', null, k), el('dd', null, String(v))); };
    if (p.env) {
      kv('Head coach', (p.env.hc || '') + (p.env.hcNew ? ' (new)' : ''));
      kv('Play-caller', (p.env.oc || p.env.playcaller || '') + (p.env.ocNew ? ' (new)' : ''));
      if (p.env.scheme) kv('Scheme', p.env.scheme);
      if (p.env.passRate) kv('Pass rate', p.env.passRate + (p.env.pace ? ' · pace ' + p.env.pace : ''));
      if (p.env.rbUsage && p.pos === 'RB') kv('Backfield', p.env.rbUsage);
      kv('Quarterback', (p.env.qb || '') + (p.env.qbNew ? ' (new)' : '') + (p.env.qbTier ? ' · tier ' + p.env.qbTier : ''));
      if (p.env.vegasWins != null || p.env.impliedPpg != null) kv('Vegas', (p.env.vegasWins != null ? p.env.vegasWins + ' wins' : '') + (p.env.impliedPpg != null ? ' · ' + fmt1(p.env.impliedPpg) + ' pts/game' : ''));
      if (p.env.olineRank) kv('O-line', 'rank ' + p.env.olineRank + ' of 32');
      if (p.env.verdict) kv('Verdict', p.env.verdict);
    }
    if (p.teamCtx && (p.teamCtx.vacTgtShare != null)) {
      kv('Vacated', Math.round(p.teamCtx.vacTgtShare * 100) + '% of 2025 targets, ' + Math.round((p.teamCtx.vacCarShare || 0) * 100) + '% of carries');
      if (p.teamCtx.departed && p.teamCtx.departed.length) kv('Gone', p.teamCtx.departed.slice(0, 3).join('; '));
      if (p.teamCtx.unavailable && p.teamCtx.unavailable.length) kv('Out', p.teamCtx.unavailable.slice(0, 2).join('; '));
    }
    if (p.chg) {
      const arrows = v => (v == null || v === 0) ? '' : (v > 0 ? '+' : '') + v;
      const parts = [['opportunity', p.chg.opportunity], ['competition', p.chg.competition], ['QB', p.chg.qb], ['coaching', p.chg.coaching]].filter(x => x[1]).map(x => x[0] + ' ' + arrows(x[1]));
      if (parts.length) kv('Change', parts.join(' · ') + (p.chg.uncertain ? ' · unresolved' : ''));
      if (p.chg.projShare != null) kv('Proj. share', Math.round(p.chg.projShare * (p.chg.projShare <= 1 ? 100 : 1)) + '% of targets');
      if (p.chg.note) kv('Note', p.chg.note);
    }
    if (p.sos) {
      kv('Schedule', p.pos + ' rank ' + p.sos.full + ' of 32 (1 = easiest)' + (p.sos.early ? ' · weeks 1-4: ' + p.sos.early : ''));
      kv('Playoffs', 'rank ' + p.sos.playoffs + (p.sos.playoffOpp ? ' · ' + p.sos.playoffOpp.join(', ') : ''));
    }
    if (!sk.childElementCount) sk.append(el('dt', null, 'Context'), el('dd', null, 'No 2026 team context on file.'));
    sit.append(sk);
    if (p.sitWhy && p.sitWhy.length) { const ul = el('ul', 'why'); ul.style.marginTop = '8px'; p.sitWhy.forEach(t => ul.append(el('li', null, t))); sit.append(ul); }
    panel.append(sit);

    if (p.note) { const n = el('p', 'note'); n.style.marginTop = '14px'; n.textContent = p.note; panel.append(n); }

    const why = el('div', 'sec'); why.append(el('h3', null, 'Why those numbers'));
    why.append(whyList('Boom', p.boomWhy, 'good'), whyList('Bust', p.bustWhy, 'bad'), whyList('Risk', p.riskWhy, 'warn'));
    panel.append(why);

    const spread = el('div', 'sec'); spread.append(el('h3', null, 'Where each source has him'));
    spread.append(el('p', 'note', 'Best ' + fmt0(p.best) + ' · worst ' + fmt0(p.worst) + ' · spread ±' + fmt1(p.sd) + ' places'));
    spread.append(rankStrip(p));
    const srcs = el('div', 'srcs');
    Object.entries(p.sources).sort((a, b) => a[1] - b[1]).forEach(([k, v]) => { srcs.append(el('span', 'k', META.sourceNames[k] || k), el('span', 'v', String(v))); });
    if (p.adpSources) Object.entries(p.adpSources).sort((a, b) => a[1] - b[1]).forEach(([k, v]) => { srcs.append(el('span', 'k', 'ADP · ' + ((META.adpNames || {})[k] || k)), el('span', 'v', fmt1(v))); });
    spread.append(srcs); panel.append(spread);

    const av = el('div', 'sec'); av.append(el('h3', null, 'Chance he is there at your picks'));
    const row = el('div', 'avail');
    const picks = myPicks(state.teams, state.slot, 16).filter(pk => pk >= 1);
    const shown = picks.filter(pk => { const pr = pAvail(p.adp, pk, p.adpSd); return pr != null && pr > 0.02 && pr < 0.995; }).slice(0, 5);
    if (!shown.length) row.append(el('p', 'note', p.adp == null ? 'No ADP on record.' : (pAvail(p.adp, picks[0], p.adpSd) >= 0.995 ? 'Safely available whenever you want him.' : 'Gone before any of your picks.')));
    shown.forEach(pk => { const pr = pAvail(p.adp, pk, p.adpSd); const a = el('div', 'a' + (pr >= 0.6 ? ' hi' : pr < 0.25 ? ' lo' : '')); a.append(el('small', null, 'Pick ' + pk), el('b', null, Math.round(pr * 100) + '%')); row.append(a); });
    av.append(row); panel.append(av);

    const acts = el('div', 'actions');
    const taken = state.taken.has(p.id), mine = state.mine.includes(p.id);
    const bt = el('button', 'btn' + (taken && !mine ? ' on' : ''), taken && !mine ? 'Taken ✓' : 'Mark taken'); bt.type = 'button';
    bt.addEventListener('click', () => { toggleTaken(p.id, false); openSheet(p.id); });
    const bm = el('button', 'btn primary' + (mine ? ' on' : ''), mine ? 'On my team ✓' : 'Draft to my team'); bm.type = 'button';
    bm.addEventListener('click', () => { toggleTaken(p.id, true); openSheet(p.id); });
    acts.append(bt, bm); panel.append(acts);

    sheet.append(panel); sheet.hidden = false; document.body.style.overflow = 'hidden';
    panel.scrollTop = 0;
  }
  function tile(lab, val, sub, tone) {
    const t = el('div', 'tile'); t.append(el('div', 'lab', lab));
    const v = el('div', 'val num' + (tone ? ' ' + tone : ''), val); t.append(v);
    if (sub) t.append(el('div', 'lab', sub));
    return t;
  }
  function whyList(lab, items, tone) {
    const wrap = el('div'); wrap.style.marginTop = '8px';
    const h = el('p', 'eyebrow', lab); wrap.append(h);
    const ul = el('ul', 'why' + (items && items.length ? '' : ' empty'));
    if (items && items.length) items.forEach(t => ul.append(el('li', null, t))); else ul.append(el('li', null, 'Nothing notable.'));
    wrap.append(ul); return wrap;
  }
  // Rank strip: one horizontal scale from 1 to the max rank in view; a dot per source, a bar for the composite, a hollow marker for ADP.
  function rankStrip(p) {
    const ranks = Object.values(p.sources);
    const all = ranks.concat([p.comp]).concat(p.adp != null ? [p.adp] : []);
    const lo = Math.max(1, Math.floor(Math.min.apply(null, all)) - 2), hi = Math.ceil(Math.max.apply(null, all)) + 2;
    const W = 320, H = 46, padL = 10, padR = 10, y = 22;
    const x = v => padL + (W - padL - padR) * (v - lo) / Math.max(1, hi - lo);
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg'); svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('class', 'strip'); svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'Source ranks from ' + fmt0(p.best) + ' to ' + fmt0(p.worst) + ', composite ' + fmt1(p.comp));
    const line = document.createElementNS(svgNS, 'line'); line.setAttribute('x1', padL); line.setAttribute('x2', W - padR); line.setAttribute('y1', y); line.setAttribute('y2', y); line.setAttribute('stroke', 'var(--hair)'); line.setAttribute('stroke-width', '1'); svg.append(line);
    const cs = getComputedStyle(document.documentElement);
    const posColor = cs.getPropertyValue('--' + p.pos.toLowerCase()).trim() || '#888';
    ranks.forEach(r => { const c = document.createElementNS(svgNS, 'circle'); c.setAttribute('cx', x(r)); c.setAttribute('cy', y); c.setAttribute('r', 5); c.setAttribute('fill', posColor); c.setAttribute('stroke', 'var(--surface)'); c.setAttribute('stroke-width', '2'); svg.append(c); });
    const cm = document.createElementNS(svgNS, 'rect'); cm.setAttribute('x', x(p.comp) - 2); cm.setAttribute('y', y - 12); cm.setAttribute('width', 4); cm.setAttribute('height', 24); cm.setAttribute('rx', 1); cm.setAttribute('fill', 'var(--ink)'); svg.append(cm);
    if (p.adp != null) { const a = document.createElementNS(svgNS, 'circle'); a.setAttribute('cx', x(p.adp)); a.setAttribute('cy', y); a.setAttribute('r', 6); a.setAttribute('fill', 'none'); a.setAttribute('stroke', 'var(--accent)'); a.setAttribute('stroke-width', '2'); svg.append(a); }
    [[lo, 'start'], [hi, 'end']].forEach(([v, anchor]) => { const t = document.createElementNS(svgNS, 'text'); t.setAttribute('x', anchor === 'start' ? padL : W - padR); t.setAttribute('y', H - 2); t.setAttribute('text-anchor', anchor); t.setAttribute('font-size', '10'); t.setAttribute('fill', 'var(--muted)'); t.setAttribute('font-family', 'inherit'); t.textContent = '#' + v; svg.append(t); });
    const leg = document.createElementNS(svgNS, 'text'); leg.setAttribute('x', W / 2); leg.setAttribute('y', H - 2); leg.setAttribute('text-anchor', 'middle'); leg.setAttribute('font-size', '10'); leg.setAttribute('fill', 'var(--muted)'); leg.textContent = '● source   ▌ composite   ○ ADP'; svg.append(leg);
    return svg;
  }

  // ---------- Draft ----------
  function toggleTaken(id, mine) {
    const isMine = state.mine.includes(id);
    const isTaken = state.taken.has(id);
    if (mine) {
      if (isMine) { state.mine = state.mine.filter(x => x !== id); state.taken.delete(id); }
      else { state.mine.push(id); state.taken.add(id); }
    } else {
      if (isMine) { state.mine = state.mine.filter(x => x !== id); state.taken.delete(id); }
      else if (isTaken) state.taken.delete(id); else state.taken.add(id);
    }
    save(); updateClock();
    if (state.tab === 'board') renderBoard(); if (state.tab === 'draft') renderDraft(); if (state.tab === 'plan') renderPlan();
  }
  function updateClock() {
    const i = nextPickInfo();
    const c = document.getElementById('clock');
    if (i.next == null) c.textContent = 'Draft done';
    else if (i.until <= 0) c.textContent = 'On the clock · #' + i.next;
    else c.textContent = 'Pick ' + i.cur + ' · yours in ' + i.until;
  }
  function renderDraft() {
    const root = document.getElementById('tab-draft'); root.replaceChildren();
    const info = nextPickInfo();

    const set = el('section', 'card');
    set.append(el('p', 'eyebrow', 'Your draft'), el('h2', null, 'Live board'));
    const sg = el('div', 'settings');
    sg.append(numField('Teams', state.teams, v => { state.teams = v; save(); renderDraft(); updateClock(); }), numField('Your slot', state.slot, v => { state.slot = v; save(); renderDraft(); updateClock(); }));
    const reset = el('button', 'btn small', 'Reset'); reset.type = 'button'; reset.addEventListener('click', () => { if (confirm('Clear every taken and drafted mark?')) { state.taken = new Set(); state.mine = []; save(); renderDraft(); updateClock(); } });
    sg.append(reset); set.append(sg);
    const pl = el('div', 'pickline');
    info.picks.forEach((pk, i) => { const s = el('span', i < info.made ? 'done' : i === info.made ? 'next' : '', '#' + pk); pl.append(s); });
    set.append(pl);
    const oc = el('div', 'onclock');
    oc.append(tile('Current pick', String(info.cur), state.taken.size + ' players off the board'), tile('Your next', info.next == null ? '–' : '#' + info.next, info.until == null ? '' : info.until <= 0 ? 'you are up' : info.until + ' picks away'));
    set.append(oc);
    const rosterH = el('p', 'eyebrow', 'My roster'); rosterH.style.marginTop = '12px'; set.append(rosterH);
    const roster = el('div', 'roster');
    if (!state.mine.length) roster.append(el('span', 'note', 'Nobody yet. Tap a player, then “Draft to my team”.'));
    state.mine.forEach(id => { const p = byId.get(id); if (p) roster.append(playerChip(p.name)); });
    set.append(roster);
    root.append(set);

    const avail = PLAYERS.filter(p => !state.taken.has(p.id));
    const nextPk = info.next;
    const best = el('section', 'card best');
    const h = el('h3', null, 'Best available'); h.append(el('small', null, 'composite')); best.append(h);
    best.append(miniList(avail.slice().sort((a, b) => a.comp - b.comp).slice(0, 8), nextPk));
    root.append(best);

    ['RB', 'WR', 'TE', 'QB'].forEach(pos => {
      const c = el('section', 'card best');
      const hh = el('h3', null, 'Best ' + pos); hh.append(el('small', null, 'top 5')); c.append(hh);
      c.append(miniList(avail.filter(p => p.pos === pos).sort((a, b) => a.comp - b.comp).slice(0, 5), nextPk));
      root.append(c);
    });

    const vals = el('section', 'card best');
    const vh = el('h3', null, 'Falling to you'); vh.append(el('small', null, 'ADP later than composite')); vals.append(vh);
    vals.append(miniList(avail.filter(p => p.value != null && p.value >= 3 && p.comp <= 120).sort((a, b) => a.comp - b.comp).slice(0, 8), nextPk));
    root.append(vals);
  }
  function numField(lab, val, onChange) {
    const l = el('label'); l.append(document.createTextNode(lab));
    const i = el('input'); i.type = 'number'; i.min = '2'; i.max = '20'; i.value = String(val); i.inputMode = 'numeric';
    i.addEventListener('change', () => { const v = parseInt(i.value, 10); if (v >= 2 && v <= 20) onChange(v); });
    l.append(i); return l;
  }
  function miniList(list, nextPk) {
    const ul = el('ul', 'mini');
    if (!list.length) { ul.append(el('li', 'empty', 'None left.')); return ul; }
    list.forEach(p => {
      const li = el('li'); const b = el('button'); b.type = 'button';
      const nm = el('span', 'nm'); nm.append(el('span', null, p.name), posChip(p.pos)); b.append(nm);
      b.append(el('span', 'cm num', fmt1(p.comp)));
      const sub = el('span', 'sub');
      const pr = nextPk != null ? pAvail(p.adp, nextPk, p.adpSd) : null;
      let txt = p.team + ' · ADP ' + fmt1(p.adp) + ' · boom ' + fmt0(p.boom) + ' / bust ' + fmt0(p.bust) + ' · 2026 ' + fmt0(p.sit);
      sub.append(document.createTextNode(txt));
      if (pr != null && nextPk != null) { sub.append(document.createTextNode(' · ')); sub.append(el('b', null, Math.round(pr * 100) + '% there at #' + nextPk)); }
      b.append(sub);
      b.addEventListener('click', () => openSheet(p.id));
      li.append(b); ul.append(li);
    });
    return ul;
  }

  // ---------- Model ----------
  function renderModel() {
    const root = document.getElementById('tab-model'); root.replaceChildren();
    const m = META.model;
    const intro = el('section', 'card');
    intro.append(el('p', 'eyebrow', 'How the numbers are made'), el('h2', null, 'The scoring model'));
    intro.append(el('p', 'lede', m.intro));
    intro.append(el('p', 'note', 'Data compiled ' + META.updated + '. ' + PLAYERS.length + ' players scored.'));
    root.append(intro);
    m.sections.forEach(s => {
      const c = el('section', 'card');
      c.append(el('h3', null, s.title));
      s.paras.forEach(t => c.append(el('p', 'note', t)));
      if (s.formula) c.append(el('div', 'formula', s.formula));
      root.append(c);
    });
    const src = el('section', 'card');
    src.append(el('p', 'eyebrow', 'Inputs'), el('h2', null, 'Sources'));
    const ul = el('ul', 'srclist');
    META.sources.forEach(s => {
      const li = el('li'); const l = el('span'); l.append(el('b', null, s.name)); if (s.note) l.append(el('small', null, s.note)); li.append(l); li.append(el('span', 'num', s.count != null ? s.count + ' players' : '')); ul.append(li);
    });
    src.append(ul); root.append(src);
    if (META.unavailable && META.unavailable.length) {
      const u = el('section', 'card');
      u.append(el('p', 'eyebrow', 'Could not reach'), el('h2', null, 'Missing inputs'));
      const ul2 = el('ul', 'list');
      META.unavailable.forEach(t => { const li = el('li'); li.append(el('span', 'n', '•'), el('span', 'note', t)); ul2.append(li); });
      u.append(ul2); root.append(u);
    }
  }

  // ---------- boot ----------
  load();
  const hashTab = (location.hash || '').replace('#', '');
  if (['plan', 'board', 'draft', 'model'].includes(hashTab)) state.tab = hashTab;
  const hashPlayer = hashTab.startsWith('p=') ? hashTab.slice(2) : null;
  seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.textContent === state.pos)));
  renderPlan(); renderBoard(); renderDraft(); renderModel(); updateClock();
  showTab(state.tab);
  if (hashPlayer && byId.has(hashPlayer)) { state.tab = 'board'; showTab('board'); openSheet(hashPlayer); }
  window.addEventListener('hashchange', () => { const t = (location.hash || '').replace('#', ''); if (['plan', 'board', 'draft', 'model'].includes(t) && t !== state.tab) showTab(t); });
})();
</script>
